meta:
  title: "Normalization (SUMN) Deep Dive"
  number: 3
  target_duration_sec: 240
  phase: 1
  description: "Content Library, publisher packs, 6 normalization statuses, suite roll-up"

slides:
  - id: title
    type: title
    duration: 3
    text: "Software Model Normalization (SUMN)"
    subtitle: "From Raw Fingerprints to Canonical Models"
    show_number: true

  - id: problem
    type: statement
    duration: 8
    text: |
      Discovery finds 40 variants of "Microsoft Office":
      Office16, Office15, O365ProPlus, MSOffice2019...
      Without normalization: catastrophic under-licensing
      on some variants, untracked installs on others.
    emphasis: "40 variants, catastrophic under-licensing"

  - id: workflow
    type: key_concept
    duration: 15
    title: "Normalization Workflow"
    bullets:
      - "1. Discovery/SUMN collects raw fingerprints → creates Discovery Model"
      - "2. SUMN matches to Content Library publisher packs → Software Model"
      - "3. Unmatched → Normalization Queue for manual review"
      - "4. Admin maps: Normalize action or Ignore"
      - "5. Normalized installs → Reconciliation"
    rule: "Normalize FIRST, then entitle. Unnormalized = unlicensed = audit risk."

  - id: statuses
    type: comparison_table
    duration: 15
    title: "Six Normalization Statuses"
    headers: ["Status", "Manual Normalize?", "Revert?"]
    rows:
      - ["New", "No", "No"]
      - ["Match Not Found", "Yes", "No"]
      - ["Publisher Normalized", "Yes", "Yes"]
      - ["Partially Normalized", "Yes", "Yes"]
      - ["Normalized", "No", "Yes"]
      - ["Manually Normalized", "No", "No"]
    highlight_row: 2
    highlight_text: "All reverts go to Match Not Found. Pattern-normalized cannot be reverted."

  - id: content_library
    type: key_concept
    duration: 12
    title: "Content Library & Publisher Packs"
    bullets:
      - "ServiceNow-maintained publisher packs: Microsoft, Oracle, Adobe, IBM, SAP, 100+"
      - "Contains: Software models, normalization rules, suite definitions, license metrics"
      - "Auto-updated via plugin com.snc.samp.content.library"
      - "Verify plugin active: com.snc.sams (SAM Pro) + com.snc.iam (ITAM)"

  - id: suites_critical
    type: statement
    duration: 10
    text: |
      SUITE ROLL-UP IS CRITICAL
      Oracle DB EE, Microsoft Office, Adobe CC = SUITES
      Components must roll up to suite for correct counting
      Without suite membership: 500 Word + 500 Excel + 500 PPT = 1,500 licenses!
    emphasis: "SUITE ROLL-UP, 1,500 licenses"

  - id: normalization_jobs
    type: comparison_table
    duration: 12
    title: "Key Normalization Jobs"
    headers: ["Job", "Cadence", "Purpose"]
    rows:
      - ["Normalize using Content Library rules", "Daily", "Auto-match discovery models"]
      - ["Discovery Model Normalization job", "Daily", "Process normalization queue"]
      - ["Discovery Model → Software Model matching", "Not documented", "Model matching"]
      - ["ML Normalization (opt-in)", "Daily", "AI-assisted matching"]
      - ["Wide-net Normalization (opt-in)", "Daily", "Broader pattern matching"]

  - id: cta
    type: next_video
    duration: 3
    text: "Next: Entitlements — Contracts, Metrics, and the Maintenance Trap"
    next_video: 4