meta:
  title: "Entitlements: Contracts, Metrics, and Hygiene"
  number: 4
  target_duration_sec: 240
  phase: 1
  description: "License metrics, true-up, maintenance trap, metric mismatch, contract linkage"

slides:
  - id: title
    type: title
    duration: 3
    text: "Entitlements — The Contract Side"
    subtitle: "License Metrics, True-Up, and the Maintenance Trap"
    show_number: true

  - id: hook
    type: statement
    duration: 5
    text: |
      An entitlement with the wrong metric
      silently breaks reconciliation.
      Per-device entitlement vs per-user usage =
      a plausible but meaningless number.
    emphasis: "wrong metric, silently breaks, meaningless number"

  - id: must_have
    type: comparison_table
    duration: 15
    title: "Entitlement Must-Have Attributes"
    headers: ["Attribute", "Why It Matters"]
    rows:
      - ["Software model", "Must match normalized model exactly"]
      - ["Publisher", "Drives publisher-specific counting rules"]
      - ["License metric", "Per user/device/core/processor/subscription — MUST match model"]
      - ["Purchased quantity", "Reconciliation numerator"]
      - ["License type", "Perpetual vs subscription vs maintenance (maintenance ≠ license!)"]
      - ["Contract + PO reference", "Audit evidence chain"]
      - ["Start / end date", "Expiry impacts compliance & renewals"]
      - ["Unit cost", "Enables cost/optimization reporting"]
      - ["Owned by / cost center", "Chargeback and showback"]
      - ["Downgrade/upgrade rights", "Microsoft/Adobe allow; Oracle/IBM do not"]

  - id: hygiene_rules
    type: key_concept
    duration: 15
    title: "Entitlement Hygiene Rules (Exam Critical)"
    bullets:
      - "One entitlement per CONTRACT LINE — not per PO. Auditors trace: entitlement → contract → PO"
      - "Never overwrite quantity to 'fix' a report — create adjustment/true-up record"
      - "MAINTENANCE ≠ LICENSE — maintenance-only records must not count as usage rights"
      - "Metric mismatch is SILENT — per-device entitlement vs per-user usage = meaningless number"
      - "Expired entitlements still counted = false compliance. Track end_date!"

  - id: license_metrics
    type: comparison_table
    duration: 15
    title: "Common License Metrics"
    headers: ["Metric", "Counted Against", "Typical Publishers"]
    rows:
      - ["Per User / Named User", "Assigned users", "Microsoft 365, Salesforce, Adobe CC, ServiceNow"]
      - ["Per Device", "Devices with install", "Windows, some Adobe"]
      - ["Per Core", "Physical cores × core factor", "Microsoft SQL Server, Oracle"]
      - ["Per Processor", "Physical sockets", "Legacy Oracle, some IBM"]
      - ["PVU (Processor Value Unit)", "PVU table per CPU model", "IBM"]
      - ["Subscription", "Time-based entitlement", "SaaS, term licenses"]

  - id: true_up
    type: statement
    duration: 8
    text: |
      TRUE-UP PROCESS:
      1. Reconciliation shows under-licensed
      2. Create NEW entitlement record (true-up) — NEVER overwrite original
      3. Link to same contract, new PO
      4. Re-run reconciliation → compliant
      5. Audit trail preserved: original + true-up = complete history

  - id: downgrade_rights
    type: key_concept
    duration: 10
    title: "Downgrade/Upgrade Rights"
    bullets:
      - "Microsoft: Version downgrades permitted (document!)"
      - "Adobe: Version downgrades permitted"
      - "Oracle: NO downgrade rights"
      - "IBM: NO downgrade rights"
      - "Must be documented on entitlement (u_downgrade_rights custom field)"

  - id: cta
    type: next_video
    duration: 3
    text: "Next: Reconciliation Engine Explained — 3 Tiers, Step-by-Step, What Breaks It"
    next_video: 5