meta:
  title: "CIS-SAM Exam Map & Study Strategy"
  number: 11
  target_duration_sec: 180
  phase: 1
  description: "5 domains, weights, official courses, what to memorize vs understand"

slides:
  - id: title
    type: title
    duration: 3
    text: "CIS-SAM Exam Map & Study Strategy"
    subtitle: "5 Domains, Weights, Official Courses, What to Memorize"
    show_number: true

  - id: hook
    type: statement
    duration: 5
    text: |
      CIS-SAM questions drawn from:
      Official training + Product Docs + Developer Site.
      Publisher questions = conceptual (which metric, which rule)
      NOT tool-click memorization.
    emphasis: "official training, product docs, conceptual not click-memorization"

  - id: domains
    type: comparison_table
    duration: 20
    title: "5 CIS-SAM Domains & Weights"
    headers: ["Domain", "Weight", "Key Topics", "This Series Videos"]
    rows:
      - ["1: SAM Overview & Fundamentals", "~15%", "ITAM/SAM positioning, lifecycle, roles, value case", "Video 1, 2"]
      - ["2: Data Integrity — Models, Normalization, Content Library", "~25%", "Software models, SUMN, publisher packs, suites, discovery models", "Video 2, 3"]
      - ["3: Entitlements, Licenses, Reconciliation", "~30%", "License metrics, entitlement records, reconciliation logic, compliance states", "Video 4, 5, 6"]
      - ["4: Optimization, Reclamation, Audit Defence", "~20%", "Reclamation, true-up, publisher rules, audit workflow", "Video 7, 9"]
      - ["5: Reporting, Dashboards, Operational Integration", "~10%", "SAM Workspace, dashboards, KPIs, integrations", "Video 8, 9"]

  - id: official_courses
    type: key_concept
    duration: 12
    title: "Official Preparation Courses (Verify Current Catalog)"
    bullets:
      - "Welcome to ServiceNow"
      - "ServiceNow Administration Fundamentals"
      - "Software Asset Management (SAM) Fundamentals"
      - "Software Asset Management Professional / Implementation"
      - "CIS-SAM Exam Preparation"

  - id: what_to_memorize
    type: key_concept
    duration: 15
    title: "What to MEMORIZE (Cold)"
    bullets:
      - "I-D-S-E-R chain (6 record types + tables)"
      - "6 Normalization statuses + manual/revert rules"
      - "6 Compliance positions + financial meaning + actions"
      - "3 Reconciliation tiers + table names"
      - "Publisher traps: Microsoft (per-core), Oracle (core factor/server), IBM (PVU/ILMT), SAP (indirect access), Adobe (VIP/ETLA)"
      - "Rights algebra: Owned, Used, Available, Allocated-not-in-use, Not-allocated-in-use"
      - "SaaS vs On-prem differences table"
      - "8 SAM Traps"
      - "Optimization priority order (6 steps)"

  - id: what_to_understand
    type: key_concept
    duration: 12
    title: "What to UNDERSTAND (Conceptual)"
    bullets:
      - "Why normalization precedes entitlement"
      - "How suite roll-up affects component counting"
      - "Why metric mismatch silently breaks reconciliation"
      - "Why Unknown ≠ Compliant (data quality vs compliance)"
      - "How publisher rules modify base reconciliation"
      - "Reclamation workflow + 60-90 day rule rationale"
      - "Connector health = data quality = compliance accuracy"

  - id: study_strategy
    type: key_concept
    duration: 15
    title: "Study Strategy (Recommended Order)"
    bullets:
      - "1. Watch this full series (12 videos) — builds mental model"
      - "2. Do the Lab (Video 12) in sub-prod instance — hands-on proof"
      - "3. Read official SAM Fundamentals + Pro course materials"
      - "4. Practice with Product Documentation search (exam is open-book-ish)"
      - "5. Take CIS-SAM prep course practice exams"
      - "6. Teach back: Explain each concept to a peer (Video 12 Step 7)"

  - id: mnemonics_recap
    type: comparison_table
    duration: 15
    title: "All Mnemonics in One Place"
    headers: ["Concept", "Mnemonic"]
    rows:
      - ["SAM Chain", "I-D-S-E-R (Install, Discovery, Software, Entitlement, Reconciliation)"]
      - ["Compliance Positions", "CUOUU (Compliant, Under, Over, Unlicensed, Unknown)"]
      - ["Normalization Statuses", "New → Match Not Found → Pub Norm → Partial → Norm → Manual"]
      - ["Business Rules", "BAA (Before, After, Async)"]
      - ["Client Scripts", "LOCS (onLoad, onChange, onSubmit, onCellEdit)"]
      - ["UI Policy vs Data Policy vs Client Script", "UDC (UI=client, Data=server, Client=both)"]
      - ["Update Set Conflicts", "ARM (Accept, Reject, Merge)"]
      - ["CMDB", "Retire Before Delete"]
      - ["Order vs Priority", "Lower = First"]
      - ["Transform Script", "Coalesce = Match"]
      - ["Debugging", "Log First, Then Debug"]
      - ["Reconciliation", "Rights Owned − Rights Used = Rights Available"]

  - id: cta
    type: next_video
    duration: 3
    text: "Next: Lab Walkthrough — Entitlement → Reconciliation → Compliance (7 Steps)"
    next_video: 12